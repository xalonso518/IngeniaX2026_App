<!-- BODY -->
<mat-dialog-content class="mb-body">
    <!-- Close -->
    <div class="close-section">
        <span class="material-symbols-rounded" (click)="onNoClick()">
            close
        </span>
    </div>
    <!-- Icono -->
    <div class="p-2 text-center mt-3">
        <span class="material-symbols-rounded error-icon">delete</span>
    </div>
    <!-- Mensajes -->
    <p class="p-titulo text-center mt-3">
        ¿Seguro de eliminar el siguiente registro?
    </p>
    <p class="p-descripcion text-center mt-2 mb-5">
        {{modulo}}: <span>{{valor}}</span>
    </p>
</mat-dialog-content>
<!-- ACCIONES -->
<mat-dialog-actions class="text-end">
    <button type="button" class="btn btn-light me-3" (click)="onNoClick()">
        <span class="material-symbols-rounded">close</span>
        Cerrar
    </button>
    <button type="button" class="btn btn-success" (click)="confirmar()">
        <span class="material-symbols-rounded">done</span>
        Confirmar
    </button>
</mat-dialog-actions>

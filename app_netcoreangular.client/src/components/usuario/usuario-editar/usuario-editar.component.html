<div class="container-fluid">
    <!-- BREADCRUMD -->
    <div class="row">
        <div class="col-12 col-sm-6 d-flex align-items-center">
            <span class="material-symbols-rounded color-txt-title">group</span>
            <a class="bread-a" routerLink="/usuario">Usuarios &nbsp;</a>
            <span class="txt-title">/ &nbsp; Editar</span>
        </div>
    </div>
    <!-- CARD -->
    <div class="row">
        <!-- Editar datos generales -->
        <div class="col-12 col-sm-6">
            <div class="card bx-shadow mt-2">
                <!-- Header -->
                <div class="card-header">
                    <div class="box-icon">
                        <span class="material-symbols-rounded">group</span>
                    </div>
                    <span class="card-txt-title">Editar usuario</span>
                </div>
                <!-- Body form -->
                <form #editarForm="ngForm" ngNativeValidate (ngSubmit)="submit(editarForm.value)">
                    <div class="card-body">
                        <!-- Titulo -->
                        <p class="form-title">Datos generales</p>
                        <!-- Fila -->
                        <div class="row">
                            <!-- Input form -->
                            <div class="col-12 col-sm-4">
                                <!-- Label -->
                                <label for="username" class="form-label">Usuario *</label>
                                <!-- Input -->
                                <div class="input-group">
                                    <input type="email" id="username" name="username" [(ngModel)]="form().username" #username="ngModel" class="form-control form-control-sm" placeholder="usuario@prasad.com.mx" disabled>
                                    <span class="input-group-text">
                                        <span class="material-symbols-rounded">
                                            person
                                        </span>
                                    </span>
                                </div>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="rol" class="form-label">Rol del usuario *</label>
                                <div class="input-group">
                                    <select id="rol" name="rol" [(ngModel)]="form().rol" class="form-select form-select-sm" required>
                                        @for (item of usuarioRoles; track item.key) {
                                        <option [ngValue]="item.key">{{item.value}}</option>
                                        }
                                    </select>
                                </div>
                            </div>
                        </div>
                        <p class="form-title mt-3">Datos personales</p>
                        <div class="row">
                            <div class="col-12 col-sm-4">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <div class="input-group">
                                    <input type="text" id="nombre" name="nombre" [(ngModel)]="form().nombre" #nombre="ngModel" class="form-control form-control-sm" placeholder="Nombre(s) Apellido(s)" required maxlength="250">
                                </div>
                                @if (nombre.invalid && (nombre.dirty || nombre.touched)) { <span class="span-error">{{errores.REQUIRED}}</span> }
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="email" class="form-label">Email</label>
                                <div class="input-group">
                                    <input type="text" id="email" name="email" [(ngModel)]="form().email" class="form-control form-control-sm" placeholder="Correo secundario" maxlength="50">
                                    <span class="input-group-text">
                                        <span class="material-symbols-rounded">
                                            mail
                                        </span>
                                    </span>
                                </div>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <div class="input-group">
                                    <input type="text" id="telefono" name="telefono" [(ngModel)]="form().telefono" class="form-control form-control-sm" placeholder="0000-0000-00" maxlength="50">
                                    <span class="input-group-text">
                                        <span class="material-symbols-rounded">
                                            call
                                        </span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Actions -->
                    <div class="card-footer text-end">
                        <button type="submit" class="btn btn-primary btn-sm" [disabled]="!editarForm.valid || submitted()">
                            @if (submitted()) {
                            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                            }@else{
                            <span class="material-symbols-rounded">save</span>
                            }
                            Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>


    </div>

</div>

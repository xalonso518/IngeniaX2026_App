<div class="back-img">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-12 col-xs-10 col-sm-8 col-md-4">
                <div class="box-blur mt-5">
                    <!-- LOGO -->
                    <div class="text-center div-logo">
                        <img src="img/logo_ingenia.png" class="img-fluid" alt="...">
                    </div>
                    <br />
                <!-- TITULO Y MENSAJE -->
                <h3 class="mb-3">Generar nueva contraseña</h3>
                <div class="alert alert-warning d-flex align-items-center" role="alert">
                    <p>
                        &#128204; Si olvidaste tu contraseña, puedes generar una provicional que se enviará a tu correo.
                    </p>
                </div>
                <!-- FORM -->
                <form (submit)="onSubmit($event)">
                    <div class=" mb-3">
                        <label for="email" class="form-label">Usuario</label>
                        <div class="input-group">
                            <input type="email" id="email" class="form-control form-control-sm" placeholder="usuario@prasad.com.mx" aria-label="Username" [formField]="resetForm.email">
                            <span class="input-group-text">
                                <span class="material-symbols-rounded">
                                    person
                                </span>
                            </span>
                        </div>
                        <app-error-input [form_input]="resetForm.email()"></app-error-input>
                    </div>
                    <div class="mb-3">
                        <a routerLink="/auth/login">¿Te acordaste de tu contraseña?</a>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary btn-sm" [disabled]="resetForm().invalid()">
                            @if (submitted()) {
                            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                            }@else{
                            <span class="material-symbols-rounded">login</span>
                            }
                            Generar nueva contraseña
                        </button>
                    </div>
                </form>
                </div>
            </div>
        </div>
    </div>
</div>
